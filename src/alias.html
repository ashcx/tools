<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="{{url}}">
<script>location.replace("{{url}}");</script>
<noscript><meta http-equiv="refresh" content="0; url={{url}}"></noscript>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f1;
    --surface: #ffffff;
    --border: #e4e1db;
    --text: #242321;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131417;
      --surface: #1c1e23;
      --border: #333840;
      --text: #f1f2f4;
    }
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 460px;
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
  }

  h1 {
    margin: 0 0 12px;
    font-size: 1.375rem;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }

  p {
    margin: 0 0 16px;
  }

  a {
    color: var(--text);
    text-underline-offset: 3px;
  }

  a:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0 20px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
  }
</style>
</head>
<body>
<main>
  <h1>{{name}}</h1>
  <p>Opening {{name}}. If it does not open, use the link below.</p>
  <ul class="links">
    <li><a href="{{url}}">Open {{name}}</a></li>
    <li><a href="../">Back to Media Toolkit</a></li>
  </ul>
</main>
</body>
</html>
