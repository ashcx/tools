<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Toolkit</title>
<meta name="description" content="Two browser-local tools for images and audio.">
<script>
  (function () {
    var root = document.documentElement;
    var key = "media-toolkit-theme";
    var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    var stored = "system";

    function readPreference() {
      try {
        var value = localStorage.getItem(key);
        if (value === "light" || value === "dark" || value === "system") {
          return value;
        }
      } catch (error) {
        return "system";
      }
      return "system";
    }

    function resolve(preference) {
      if (preference === "dark") {
        return "dark";
      }
      if (preference === "light") {
        return "light";
      }
      return query && query.matches ? "dark" : "light";
    }

    function paint(preference) {
      root.dataset.theme = resolve(preference);
    }

    function save(preference) {
      try {
        localStorage.setItem(key, preference);
      } catch (error) {
        // A blocked store must not break the page.
      }
    }

    stored = readPreference();
    paint(stored);

    function followSystem() {
      if (stored === "system") {
        paint(stored);
      }
    }

    function start() {
      var control = document.querySelector(".theme-control");
      if (!control) {
        return;
      }
      var current = document.getElementById("theme-" + stored);
      if (current) {
        current.checked = true;
      }
      control.addEventListener("change", function (event) {
        var input = event.target;
        if (!input || input.name !== "theme" || !input.checked) {
          return;
        }
        stored = input.value;
        paint(stored);
        save(stored);
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start);
    } else {
      start();
    }

    if (query && query.addEventListener) {
      query.addEventListener("change", followSystem);
    }
  })();
</script>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <fieldset class="theme-control">
      <legend class="visually-hidden">Theme</legend>
      <div class="theme-control__segments">
        <input class="theme-control__input" type="radio" name="theme" id="theme-system" value="system" checked>
        <label class="theme-control__option" for="theme-system">System</label>
        <input class="theme-control__input" type="radio" name="theme" id="theme-light" value="light">
        <label class="theme-control__option" for="theme-light">Light</label>
        <input class="theme-control__input" type="radio" name="theme" id="theme-dark" value="dark">
        <label class="theme-control__option" for="theme-dark">Dark</label>
      </div>
    </fieldset>
  </div>
</header>
<main id="main" tabindex="-1">
  <div class="wrap stage">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect class="brand__plate" x="2" y="2" width="60" height="60" rx="16"/>
        <g class="brand__bars">
          <path d="M20 27v10"/>
          <path d="M28 20v24"/>
          <path d="M36 14v36"/>
          <path d="M44 23v18"/>
        </g>
      </svg>
      <h1 class="brand__name">Media Toolkit</h1>
      <p class="brand__lede">Two browser-local tools for images and audio.</p>
    </div>
    <nav class="tool-grid" aria-label="Tools">
      <a class="tool-card tool-card--image" href="./image-compressor/" aria-labelledby="tool-image-title" aria-describedby="tool-image-summary">
        <h2 class="tool-card__title" id="tool-image-title">Image Compressor</h2>
        <p class="tool-card__lead" id="tool-image-summary">Compress, convert, resize</p>
        <span class="tool-card__arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10"/><path d="M9 4l4 4-4 4"/></svg></span>
      </a>
      <a class="tool-card tool-card--audio" href="./audio-toolkit/" aria-labelledby="tool-audio-title" aria-describedby="tool-audio-summary">
        <h2 class="tool-card__title" id="tool-audio-title">Audio Toolkit</h2>
        <p class="tool-card__lead" id="tool-audio-summary">Trim, process, export audio</p>
        <span class="tool-card__arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10"/><path d="M9 4l4 4-4 4"/></svg></span>
      </a>
    </nav>
  </div>
</main>
</body>
</html>
