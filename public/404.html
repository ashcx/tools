<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/tools/">
<title>Page not found · Media Toolkit</title>
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface-subtle: #faf9f7;
    --border: #e4e1db;
    --border-strong: #d5d1c9;
    --text: #242321;
    --muted: #78756e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131417;
      --surface: #1c1e23;
      --surface-subtle: #22252b;
      --border: #333840;
      --border-strong: #454c57;
      --text: #f1f2f4;
      --muted: #9aa1ac;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 560px;
    padding: 32px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
  }

  .eyebrow {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 650;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.75rem, 1.4rem + 1.6vw, 2.25rem);
    font-weight: 650;
    line-height: 1.15;
    letter-spacing: -0.025em;
  }

  p {
    margin: 0 0 24px;
    max-width: 46ch;
  }

  .links {
    display: grid;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-subtle);
    color: inherit;
    font-weight: 500;
    text-decoration: none;
    transition: border-color 150ms ease;
  }

  .link-arrow {
    color: var(--muted);
  }

  .links a:hover {
    border-color: var(--border-strong);
  }

  a:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .links a {
      transition: none;
    }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Media Toolkit</p>
  <h1>Page not found</h1>
  <p>That page was not found. Try one of these instead.</p>
  <ul class="links">
    <li><a href="./">Media Toolkit home <span class="link-arrow" aria-hidden="true">&rarr;</span></a></li>
    <li><a href="./image-compressor/">Image Compressor <span class="link-arrow" aria-hidden="true">&rarr;</span></a></li>
    <li><a href="./audio-toolkit/">Audio Toolkit <span class="link-arrow" aria-hidden="true">&rarr;</span></a></li>
  </ul>
</main>
</body>
</html>
